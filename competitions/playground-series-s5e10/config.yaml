name: playground-series-s5e10
url: https://www.kaggle.com/competitions/playground-series-s5e10
description: Predict road accident risk from road and environmental features
problem_type: regression
evaluation_metric: RMSE
optimization_direction: minimize
target_column: accident_risk
id_column: id
train_file: train.csv
test_file: test.csv
sample_submission_file: sample_submission.csv
special_rules:
  external_data_allowed: true
  pretrained_models_allowed: true
  internet_access_allowed: true
  daily_submission_limit: 5
notes: |
  517K train / 173K test. Target: accident_risk (0-1, mean=0.352). RMSE, minimize.
  Features: road_type, num_lanes, curvature, speed_limit, lighting, weather,
  road_signs_present, public_road, time_of_day, holiday, school_season,
  num_reported_accidents. No missing values.
  curvature (r=0.54) and speed_limit (r=0.43) strongest predictors.
  lighting=night notably increases risk (0.47 vs 0.30).
  Cross-season note: this is the S5E10 unit (3/5) of the cross-season
  generalization sweep (after s4e1, s4e11). Feb 2026 run (STATUS.md,
  experiments.json exp 1-4) already trained LGB/XGB/LGBM_v2 + an OOF
  weight-searched ensemble (CV RMSE 0.056074, Public LB 0.05558, Private
  0.05583) on a 27-feature engineered set with KFold(5, shuffle, seed=42) --
  kept verbatim as the stage-1 record per this unit's protocol ("reuse
  equivalent Feb records, don't retrain"), with the honest caveat that its
  features were already EDA-engineered (not raw) and its third member was a
  second LightGBM rather than CatBoost. The July run reuses the same folds
  (KFold split depends only on n_samples + seed), so all scores are directly
  comparable across both runs. Stage-3 round-1 prior checks: the s3e9
  "explicit product interactions add nothing for GBDT" prior CONFIRMED here
  (12 base features beat the 27-feature set per solo LGB), and the s3e14
  snap-to-grid prior REJECTED for RMSE (target sits on a 0.01 grid but
  squared error wants the conditional mean, not a grid point).
