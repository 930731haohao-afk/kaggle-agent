[project]
name = "kaggle-agent"
version = "0.1.0"
description = "Hybrid AI agent for Kaggle competitions"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "catboost>=1.2.8",
    "holidays>=0.101",
    "kaggle>=1.8.4",
    "librosa>=0.11.0",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.8",
    "mlflow-skinny>=3.14.0",
    "numpy>=2.4.2",
    "optuna>=4.9.0",
    "pandas>=3.0.0",
    "pyarrow>=25.0.0",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.1",
    "soundfile>=0.13.1",
    "tiktoken>=0.12.0",
    "tqdm>=4.67.3",
    "xgboost>=3.1.3",
]

[dependency-groups]
dev = [
    "markdown>=3.10.2",
    "pytest>=9.1.1",
]

# Check-only lint gate for hand-written infrastructure. competitions/ is the
# frozen as-run record of past experiments — never lint or auto-fix it.
# Rules are the "silently wrong numbers" family only; no style rules.
[tool.ruff]
extend-exclude = ["competitions", "competitions_vision", "external_data"]

[tool.ruff.lint]
select = ["F821", "F841", "B023", "B006", "E722", "PLW1510", "RUF059"]

# Note: torch, torchvision, torchaudio are installed via:
# uv pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/nightly/cu130
# They are NOT managed in uv.lock due to triton dependency resolution issues
